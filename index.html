<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUA Appointment Booking</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="container">
    <header>
      <h1>Cellin Make Up Artist Booking</h1>
      <p>Pilih jadwal dan layanan makeup kamu di sini ✨</p>
    </header>

    <form id="bookingForm">
      <!-- 1. Pilih Layanan -->
      <div class="form-group">
        <label for="serviceSelect">Pilih Layanan:</label>
        <select id="serviceSelect" required>
          <option value="">-- Memuat Layanan... --</option>
        </select>
      </div>

      <!-- 2. Pilih Tanggal -->
      <div class="form-group">
        <label for="bookingDate">Pilih Tanggal:</label>
        <input type="date" id="bookingDate" required>
      </div>

      <!-- 3. Pilih Jam -->
      <div class="form-group">
        <label for="timeSlot">Pilih Jam Availability:</label>
        <select id="timeSlot" required disabled>
          <option value="">Pilih tanggal terlebih dahulu</option>
        </select>
      </div>

      <!-- 4. Data Pelanggan -->
      <div class="form-group">
        <label for="clientName">Nama Lengkap:</label>
        <input type="text" id="clientName" placeholder="Contoh: Amanda" required>
      </div>

      <div class="form-group">
        <label for="clientPhone">No. WhatsApp:</label>
        <input type="tel" id="clientPhone" placeholder="08123456789" required>
      </div>

      <!-- Info Pembayaran -->
      <div class="payment-info">
        <h3>Informasi Pembayaran</h3>
        <p>Silakan transfer ke rekening berikut setelah konfirmasi:</p>
        <p><strong>Bank BCA: 1234-5678-90</strong><br>a.n. Cellin</p>
      </div>

      <button type="submit" id="submitBtn">Konfirmasi & Kirim Bukti via WhatsApp</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
