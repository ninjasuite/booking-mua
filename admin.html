<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin MUA</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-pink-50/50 min-h-screen text-gray-800 pb-12">

  <div class="max-w-3xl mx-auto px-4 py-8">
    
    <!-- Header Dashboard -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-pink-600 flex items-center justify-center gap-2">
        Dashboard Admin MUA ✨
      </h1>
      <p class="text-gray-500 text-sm mt-1">Kelola jadwal & konfirmasi pembayaran pelanggan</p>
    </div>

    <!-- Filter Tanggal Card -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-pink-100 mb-6">
      <label for="filterDate" class="block text-sm font-semibold text-gray-700 mb-2">
        Filter Berdasarkan Tanggal:
      </label>
      <input 
        type="date" 
        id="filterDate" 
        class="w-full px-4 py-2.5 border border-pink-200 rounded-xl bg-pink-50/30 focus:outline-none focus:ring-2 focus:ring-pink-400 focus:bg-white text-gray-700 font-medium transition"
      />
    </div>

    <!-- Container Daftar Booking (Akan diisi otomatis oleh admin.js) -->
    <div id="bookingList" class="min-h-[200px]">
      <div class="text-center py-8 text-gray-500 bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <p class="animate-pulse">Memuat data booking...</p>
      </div>
    </div>

  </div>

  <!-- Menghubungkan ke file JavaScript Admin -->
  <script src="admin.js"></script>
</body>
</html>
